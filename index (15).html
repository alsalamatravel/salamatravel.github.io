:root{--bg:#0a1630;--bg2:#12284f;--ink:#fbf3e2;--muted:#cfc6b3;--gold:#d9a45b;--gold-soft:#f2d49b;--line:rgba(217,164,91,.35);--btn-ink:#0f2347;--sky:#4aa8e0;--teal:#2bb59a;color-scheme:light dark}

header .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{text-decoration:none;color:var(--gold-soft);font-size:18px;letter-spacing:3px;margin-inline-end:auto}

.btn:hover{background:var(--gold-soft);color:var(--btn-ink)}

.hero .wrap{display:grid;gap:36px;grid-template-columns:1.1fr 1fr;align-items:center}
h1{font-size:clamp(32px,5.5vw,52px);line-height:1.2;font-weight:400}
.hero p{color:var(--muted);font-size:18px;margin-top:16px;max-width:30em}

.req .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

section{padding:62px 0;border-top:1px solid var(--line)}
h2.t{font-size:clamp(26px,4vw,36px);font-weight:400;color:var(--gold-soft);margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:30px;max-width:36em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{border-radius:18px;padding:26px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,transparent),rgba(251,243,226,.04) 70%);border-top:3px solid var(--c)}
.card svg{width:52px;height:52px;margin-bottom:14px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card h3{font-size:22px;font-weight:400;margin-bottom:6px}
.card p{color:var(--muted)}
.dest{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dest div{border-radius:14px;padding:70px 16px 16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--a),var(--b))}
.dest b{display:block;font-weight:400;font-size:19px}
.dest span{font-size:13px;color:var(--ink);opacity:.8}
.steps{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.steps li::before{counter-increment:s;content:counter(s);width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold-soft);margin-bottom:10px}
.steps b{display:block;font-weight:400;font-size:19px}
.steps p{color:var(--muted)}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.why div{padding:4px 26px;border-inline-start:1px solid var(--line)}
.why div:first-child{border-inline-start:0;padding-inline-start:0}
.why h3{font-weight:400;font-size:20px;margin-bottom:6px}.why p{color:var(--muted)}
.contact{background:var(--bg2);text-align:center}
.contact .sub{margin-inline:auto}
.soc{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 22px;margin-top:28px;list-style:none}
.soc a{color:var(--gold-soft);text-decoration:none;border-bottom:1px solid var(--line)}
footer{padding:24px 0 32px;text-align:center;color:var(--muted);font-size:13px}
.phones{margin-top:26px;color:var(--muted);display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px}
.phones a{color:var(--gold-soft);text-decoration:none;border-bottom:1px solid var(--line);direction:ltr;unicode-bidi:isolate}
.wa-float{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:6}
.wa-float svg{width:34px;height:34px}
.why.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:820px){nav{display:none}.hero .wrap,.cards,.steps,.why,.why.two{grid-template-columns:1fr}.dest{grid-template-columns:1fr 1fr}.why div{border-inline-start:0;padding:0;margin-bottom:22px}}
